apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway
  namespace: paylater

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:
      containers:
        - name: gateway
          image: haripriyanka99/paylater-gateway:v2
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 9090
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: ADMIN_SERVICE_URL
              value: http://admin:9093

            - name: MERCHANT_SERVICE_URL
              value: http://merchant:9094

            - name: REPORT_SERVICE_URL
              value: http://report:9095

            - name: USER_SERVICE_URL
              value: http://user:9091

            - name: TRANSACTION_SERVICE_URL
              value: http://transaction:9092

          readinessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 10
          