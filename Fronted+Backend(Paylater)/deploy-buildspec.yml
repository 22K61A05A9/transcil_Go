version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    ECR_REGISTRY: "465630415715.dkr.ecr.us-east-1.amazonaws.com"
    K3S_INSTANCE_ID: "i-026572c393f77f8cf"

phases:

  install:
    commands:
      - echo "=== DEPLOY INSTALL PHASE ==="
      - aws --version
      - echo "Checking SSM instance..."
      - aws ssm describe-instance-information --region "$AWS_DEFAULT_REGION"

  pre_build:
    commands:
      - echo "=== DEPLOY PRE-BUILD PHASE ==="
      - pwd
      - ls -la
      - echo "Searching for image-tag.txt..."
      - find "$CODEBUILD_SRC_DIR" -name "image-tag.txt" -type f -print

      - |
        if [ ! -f "$CODEBUILD_SRC_DIR/image-tag.txt" ]; then
          echo "ERROR: image-tag.txt was not found"
          exit 1
        fi

      - IMAGE_TAG=$(cat "$CODEBUILD_SRC_DIR/image-tag.txt")
      - echo "IMAGE_TAG=$IMAGE_TAG"

      - |
        if [ -z "$IMAGE_TAG" ]; then
          echo "ERROR: IMAGE_TAG is empty"
          exit 1
        fi

      - echo "K3S_INSTANCE_ID=$K3S_INSTANCE_ID"

  build:
    commands:
      - echo "=== DEPLOY PHASE ==="
      - IMAGE_TAG=$(cat "$CODEBUILD_SRC_DIR/image-tag.txt")
      - echo "Deploying IMAGE_TAG=$IMAGE_TAG"

      - |
        DEPLOY_COMMANDS="set -e
        echo '=== PayLater K3s deployment started ==='
        REGION='us-east-1'
        REGISTRY='465630415715.dkr.ecr.us-east-1.amazonaws.com'
        TAG='$IMAGE_TAG'

        echo 'Checking Kubernetes...'
        kubectl get nodes
        kubectl get namespace paylater

        echo 'Creating ECR pull secret...'
        ECR_PASSWORD=\$(aws ecr get-login-password --region \$REGION)

        kubectl create secret docker-registry ecr-registry-secret \
          --docker-server=\$REGISTRY \
          --docker-username=AWS \
          --docker-password=\$ECR_PASSWORD \
          --namespace=paylater \
          --dry-run=client \
          -o yaml | kubectl apply -f -

        echo 'Configuring ECR pull secret...'

        for DEPLOYMENT in user transaction merchant admin report gateway frontend
        do
          echo \"Patching deployment: \$DEPLOYMENT\"

          kubectl -n paylater patch deployment \$DEPLOYMENT \
            --type='strategic' \
            -p '{\"spec\":{\"template\":{\"spec\":{\"imagePullSecrets\":[{\"name\":\"ecr-registry-secret\"}]}}}}'
        done

        echo 'Updating deployment images...'

        kubectl -n paylater set image deployment/user user=\$REGISTRY/paylater-user:\$TAG
        kubectl -n paylater set image deployment/transaction transaction=\$REGISTRY/paylater-transaction:\$TAG
        kubectl -n paylater set image deployment/merchant merchant=\$REGISTRY/paylater-merchant:\$TAG
        kubectl -n paylater set image deployment/admin admin=\$REGISTRY/paylater-admin:\$TAG
        kubectl -n paylater set image deployment/report report=\$REGISTRY/paylater-report:\$TAG
        kubectl -n paylater set image deployment/gateway gateway=\$REGISTRY/paylater-gateway:\$TAG
        kubectl -n paylater set image deployment/frontend frontend=\$REGISTRY/paylater-frontend:\$TAG

        echo 'Waiting for rollouts...'

        kubectl -n paylater rollout status deployment/user --timeout=300s
        kubectl -n paylater rollout status deployment/transaction --timeout=300s
        kubectl -n paylater rollout status deployment/merchant --timeout=300s
        kubectl -n paylater rollout status deployment/admin --timeout=300s
        kubectl -n paylater rollout status deployment/report --timeout=300s
        kubectl -n paylater rollout status deployment/gateway --timeout=300s
        kubectl -n paylater rollout status deployment/frontend --timeout=300s

        echo '=== FINAL POD STATUS ==='
        kubectl -n paylater get pods -o wide

        echo '=== DEPLOYMENT STATUS ==='
        kubectl -n paylater get deployments

        echo '=== PayLater deployment completed successfully ==='"

      - echo "Sending deployment command to K3s instance..."

      - |
        COMMAND_ID=$(aws ssm send-command \
          --region "$AWS_DEFAULT_REGION" \
          --instance-ids "$K3S_INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --comment "PayLater CI/CD deployment" \
          --parameters "commands=$DEPLOY_COMMANDS" \
          --query "Command.CommandId" \
          --output text)

        echo "SSM Command ID: $COMMAND_ID"

        if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
          echo "ERROR: SSM command was not created"
          exit 1
        fi

        echo "Waiting for SSM deployment..."

        aws ssm wait command-executed \
          --region "$AWS_DEFAULT_REGION" \
          --command-id "$COMMAND_ID" \
          --instance-id "$K3S_INSTANCE_ID"

        STATUS=$(aws ssm get-command-invocation \
          --region "$AWS_DEFAULT_REGION" \
          --command-id "$COMMAND_ID" \
          --instance-id "$K3S_INSTANCE_ID" \
          --query "Status" \
          --output text)

        echo "SSM Status: $STATUS"

        echo "=== SSM OUTPUT ==="

        aws ssm get-command-invocation \
          --region "$AWS_DEFAULT_REGION" \
          --command-id "$COMMAND_ID" \
          --instance-id "$K3S_INSTANCE_ID" \
          --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
          --output json

        if [ "$STATUS" != "Success" ]; then
          echo "ERROR: PayLater Kubernetes deployment failed"
          exit 1
        fi

      - echo "PayLater deployment successful."

  post_build:
    commands:
      - echo "=== DEPLOY POST-BUILD PHASE ==="
      - echo "PayLater CD completed successfully."
      - echo "Deployed image tag:"
      - cat "$CODEBUILD_SRC_DIR/image-tag.txt"
