version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    ECR_REGISTRY: "465630415715.dkr.ecr.us-east-1.amazonaws.com"
    K3S_INSTANCE_ID: "i-026572c393f77f8cf"

phases:

  install:
    commands:
      - 'echo "=== DEPLOY INSTALL PHASE ==="'
      - aws --version
      - 'echo "Checking SSM instance..."'
      - aws ssm describe-instance-information --region "$AWS_DEFAULT_REGION"

  pre_build:
    commands:
      - 'echo "=== DEPLOY PRE-BUILD PHASE ==="'
      - 'echo "Current directory:"'
      - pwd

      - 'echo "Available files:"'
      - ls -la

      - 'echo "Checking image-tag.txt..."'

      - |
        if [ ! -f "$CODEBUILD_SRC_DIR/image-tag.txt" ]; then
          echo "ERROR: image-tag.txt was not found"
          echo "Build artifact was not passed correctly to Deploy stage."
          exit 1
        fi

      - IMAGE_TAG=$(tr -d '[:space:]' < "$CODEBUILD_SRC_DIR/image-tag.txt")

      - |
        if [ -z "$IMAGE_TAG" ]; then
          echo "ERROR: image-tag.txt is empty"
          exit 1
        fi

      - 'echo "======================================"'
      - 'echo "Deployment image tag: $IMAGE_TAG"'
      - 'echo "K3s instance: $K3S_INSTANCE_ID"'
      - 'echo "======================================"'

  build:
    commands:
      - 'echo "=== DEPLOY PHASE ==="'

      - IMAGE_TAG=$(tr -d '[:space:]' < "$CODEBUILD_SRC_DIR/image-tag.txt")

      - 'echo "Deploying IMAGE_TAG=$IMAGE_TAG"'

      - 'echo "Creating deployment script..."'

      - |
        cat > /tmp/paylater-deploy.sh <<'SCRIPT'
        #!/bin/bash

        set -e

        echo "======================================"
        echo "PayLater K3s deployment started"
        echo "======================================"

        REGION="us-east-1"
        REGISTRY="465630415715.dkr.ecr.us-east-1.amazonaws.com"
        TAG="__IMAGE_TAG__"

        echo "Image tag: $TAG"
        echo "Registry: $REGISTRY"

        echo "======================================"
        echo "Checking required commands"
        echo "======================================"

        if ! command -v aws >/dev/null 2>&1; then
          echo "ERROR: AWS CLI not found on K3s instance"
          exit 1
        fi

        if ! command -v k3s >/dev/null 2>&1; then
          echo "ERROR: k3s command not found"
          exit 1
        fi

        KUBECTL="k3s kubectl"

        echo "AWS CLI:"
        aws --version

        echo "K3s version:"
        k3s --version

        echo "======================================"
        echo "Checking Kubernetes nodes"
        echo "======================================"

        $KUBECTL get nodes

        echo "======================================"
        echo "Checking paylater namespace"
        echo "======================================"

        if ! $KUBECTL get namespace paylater >/dev/null 2>&1; then
          echo "ERROR: paylater namespace does not exist"
          exit 1
        fi

        $KUBECTL get namespace paylater

        echo "======================================"
        echo "Checking ECR access"
        echo "======================================"

        aws ecr describe-repositories \
          --region "$REGION" \
          --repository-names \
            paylater-user \
            paylater-transaction \
            paylater-merchant \
            paylater-admin \
            paylater-report \
            paylater-gateway \
            paylater-frontend \
          >/dev/null

        echo "ECR repositories are accessible."

        echo "======================================"
        echo "Checking ECR image tags"
        echo "======================================"

        for REPOSITORY in \
          paylater-user \
          paylater-transaction \
          paylater-merchant \
          paylater-admin \
          paylater-report \
          paylater-gateway \
          paylater-frontend
        do
          echo "Checking $REPOSITORY:$TAG"

          aws ecr describe-images \
            --region "$REGION" \
            --repository-name "$REPOSITORY" \
            --image-ids imageTag="$TAG" \
            >/dev/null

          echo "$REPOSITORY:$TAG exists."
        done

        echo "======================================"
        echo "Creating/updating ECR pull secret"
        echo "======================================"

        ECR_PASSWORD=$(aws ecr get-login-password --region "$REGION")

        $KUBECTL create secret docker-registry ecr-registry-secret \
          --docker-server="$REGISTRY" \
          --docker-username=AWS \
          --docker-password="$ECR_PASSWORD" \
          --namespace=paylater \
          --dry-run=client \
          -o yaml | $KUBECTL apply -f -

        echo "ECR pull secret configured successfully."

        echo "======================================"
        echo "Configuring imagePullSecrets"
        echo "======================================"

        for DEPLOYMENT in user transaction merchant admin report gateway frontend
        do
          echo "Patching deployment: $DEPLOYMENT"

          $KUBECTL -n paylater patch deployment "$DEPLOYMENT" \
            --type='strategic' \
            -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"ecr-registry-secret"}]}}}}'
        done

        echo "======================================"
        echo "Updating deployment images"
        echo "======================================"

        $KUBECTL -n paylater set image deployment/user \
          user="$REGISTRY/paylater-user:$TAG"

        $KUBECTL -n paylater set image deployment/transaction \
          transaction="$REGISTRY/paylater-transaction:$TAG"

        $KUBECTL -n paylater set image deployment/merchant \
          merchant="$REGISTRY/paylater-merchant:$TAG"

        $KUBECTL -n paylater set image deployment/admin \
          admin="$REGISTRY/paylater-admin:$TAG"

        $KUBECTL -n paylater set image deployment/report \
          report="$REGISTRY/paylater-report:$TAG"

        $KUBECTL -n paylater set image deployment/gateway \
          gateway="$REGISTRY/paylater-gateway:$TAG"

        $KUBECTL -n paylater set image deployment/frontend \
          frontend="$REGISTRY/paylater-frontend:$TAG"

        echo "All deployment images updated."

        echo "======================================"
        echo "Waiting for Kubernetes rollouts"
        echo "======================================"

        $KUBECTL -n paylater rollout status deployment/user --timeout=300s
        $KUBECTL -n paylater rollout status deployment/transaction --timeout=300s
        $KUBECTL -n paylater rollout status deployment/merchant --timeout=300s
        $KUBECTL -n paylater rollout status deployment/admin --timeout=300s
        $KUBECTL -n paylater rollout status deployment/report --timeout=300s
        $KUBECTL -n paylater rollout status deployment/gateway --timeout=300s
        $KUBECTL -n paylater rollout status deployment/frontend --timeout=300s

        echo "======================================"
        echo "FINAL POD STATUS"
        echo "======================================"

        $KUBECTL -n paylater get pods -o wide

        echo "======================================"
        echo "DEPLOYMENT STATUS"
        echo "======================================"

        $KUBECTL -n paylater get deployments

        echo "======================================"
        echo "PayLater deployment completed successfully"
        echo "======================================"
        SCRIPT

      - 'echo "Injecting image tag into deployment script..."'

      - |
        if ! grep -q "__IMAGE_TAG__" /tmp/paylater-deploy.sh; then
          echo "ERROR: IMAGE_TAG placeholder not found"
          exit 1
        fi

      - sed -i "s/__IMAGE_TAG__/$IMAGE_TAG/g" /tmp/paylater-deploy.sh

      - 'echo "Encoding deployment script..."'

      - SCRIPT_B64=$(base64 -w 0 /tmp/paylater-deploy.sh)

      - |
        if [ -z "$SCRIPT_B64" ]; then
          echo "ERROR: Deployment script encoding failed"
          exit 1
        fi

      - 'echo "Sending deployment command to EC2 through SSM..."'

      - |
        SSM_COMMAND="echo $SCRIPT_B64 | base64 -d > /tmp/paylater-deploy.sh && chmod +x /tmp/paylater-deploy.sh && /tmp/paylater-deploy.sh"

        COMMAND_ID=$(aws ssm send-command \
          --region "$AWS_DEFAULT_REGION" \
          --instance-ids "$K3S_INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --comment "PayLater CI/CD deployment" \
          --parameters "commands=$SSM_COMMAND" \
          --query "Command.CommandId" \
          --output text)

        echo "SSM Command ID: $COMMAND_ID"

        if [ -z "$COMMAND_ID" ] || [ "$COMMAND_ID" = "None" ]; then
          echo "ERROR: SSM command was not created"
          exit 1
        fi

        echo "======================================"
        echo "Waiting for SSM deployment"
        echo "======================================"

        MAX_ATTEMPTS=360
        ATTEMPT=0

        while true
        do
          STATUS=$(aws ssm get-command-invocation \
            --region "$AWS_DEFAULT_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$K3S_INSTANCE_ID" \
            --query "Status" \
            --output text)

          echo "SSM Status: $STATUS"

          case "$STATUS" in
            Success)
              echo "SSM deployment completed successfully."
              break
              ;;

            Failed|Cancelled|TimedOut|Cancelling)
              echo "ERROR: SSM deployment failed with status: $STATUS"
              break
              ;;

            Pending|InProgress|Delayed)
              ATTEMPT=$((ATTEMPT + 1))

              if [ "$ATTEMPT" -ge "$MAX_ATTEMPTS" ]; then
                echo "ERROR: SSM deployment timed out while waiting."
                STATUS="TimedOut"
                break
              fi

              sleep 5
              ;;

            *)
              echo "ERROR: Unknown SSM status: $STATUS"
              break
              ;;
          esac
        done

        echo "======================================"
        echo "SSM OUTPUT"
        echo "======================================"

        aws ssm get-command-invocation \
          --region "$AWS_DEFAULT_REGION" \
          --command-id "$COMMAND_ID" \
          --instance-id "$K3S_INSTANCE_ID" \
          --query "{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}" \
          --output json

        if [ "$STATUS" != "Success" ]; then
          echo "ERROR: PayLater Kubernetes deployment failed"
          exit 1
        fi

      - 'echo "PayLater deployment successful."'

  post_build:
    commands:
      - 'echo "=== DEPLOY POST-BUILD PHASE ==="'
      - 'echo "PayLater CD completed successfully."'
      - 'echo "Deployed image tag:"'
      - cat "$CODEBUILD_SRC_DIR/image-tag.txt"
