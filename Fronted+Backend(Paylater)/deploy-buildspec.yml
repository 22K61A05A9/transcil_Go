version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    ECR_REGISTRY: "465630415715.dkr.ecr.us-east-1.amazonaws.com"
    K3S_INSTANCE_ID: "i-026572c393f77f8cf"

phases:

  install:
    commands:
      - echo "=== DEPLOY INSTALL PHASE ==="
      - aws --version
      - echo "Checking AWS Systems Manager..."
      - aws ssm describe-instance-information --region "$AWS_DEFAULT_REGION"

  pre_build:
    commands:
      - echo "=== DEPLOY PRE-BUILD PHASE ==="
      - echo "Source version:"
      - echo "$CODEBUILD_RESOLVED_SOURCE_VERSION"
      - echo "K3s server:"
      - echo "$K3S_INSTANCE_ID"
      - |
        if [ -z "$CODEBUILD_RESOLVED_SOURCE_VERSION" ]; then
          echo "ERROR: CODEBUILD_RESOLVED_SOURCE_VERSION is empty"
          exit 1
        fi
        echo "Deployment image tag:"
        echo "$CODEBUILD_RESOLVED_SOURCE_VERSION"

  build:
    commands:
      - echo "=== DEPLOY PHASE ==="
      - echo "Sending deployment command to K3s server..."
      - |
        COMMAND_ID=$(aws ssm send-command \
          --region "$AWS_DEFAULT_REGION" \
          --instance-ids "$K3S_INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --comment "PayLater CI/CD deployment" \
          --parameters 'commands=[
            "set -e",
            "echo === K3s deployment started ===",
            "echo Deployment started",
            "kubectl get nodes",
            "kubectl get namespace paylater",
            "kubectl -n paylater set image deployment/user user='$ECR_REGISTRY/paylater-user:$CODEBUILD_RESOLVED_SOURCE_VERSION'",
            "kubectl -n paylater set image deployment/transaction transaction='$ECR_REGISTRY/paylater-transaction:$CODEBUILD_RESOLVED_SOURCE_VERSION'",
            "kubectl -n paylater set image deployment/merchant merchant='$ECR_REGISTRY/paylater-merchant:$CODEBUILD_RESOLVED_SOURCE_VERSION'",
            "kubectl -n paylater set image deployment/admin admin='$ECR_REGISTRY/paylater-admin:$CODEBUILD_RESOLVED_SOURCE_VERSION'",
            "kubectl -n paylater set image deployment/report report='$ECR_REGISTRY/paylater-report:$CODEBUILD_RESOLVED_SOURCE_VERSION'",
            "kubectl -n paylater set image deployment/gateway gateway='$ECR_REGISTRY/paylater-gateway:$CODEBUILD_RESOLVED_SOURCE_VERSION'",
            "kubectl -n paylater set image deployment/frontend frontend='$ECR_REGISTRY/paylater-frontend:$CODEBUILD_RESOLVED_SOURCE_VERSION'",
            "kubectl -n paylater rollout status deployment/user --timeout=300s",
            "kubectl -n paylater rollout status deployment/transaction --timeout=300s",
            "kubectl -n paylater rollout status deployment/merchant --timeout=300s",
            "kubectl -n paylater rollout status deployment/admin --timeout=300s",
            "kubectl -n paylater rollout status deployment/report --timeout=300s",
            "kubectl -n paylater rollout status deployment/gateway --timeout=300s",
            "kubectl -n paylater rollout status deployment/frontend --timeout=300s",
            "kubectl -n paylater get pods -o wide",
            "echo PayLater deployment completed successfully"
          ]' \
          --output text \
          --query 'Command.CommandId')

        echo "SSM Command ID: $COMMAND_ID"

        if [ -z "$COMMAND_ID" ]; then
          echo "ERROR: Failed to create SSM command"
          exit 1
        fi

        echo "Waiting for deployment command..."

        aws ssm wait command-executed \
          --region "$AWS_DEFAULT_REGION" \
          --command-id "$COMMAND_ID" \
          --instance-id "$K3S_INSTANCE_ID"

        STATUS=$(aws ssm get-command-invocation \
          --region "$AWS_DEFAULT_REGION" \
          --command-id "$COMMAND_ID" \
          --instance-id "$K3S_INSTANCE_ID" \
          --query 'Status' \
          --output text)

        echo "SSM deployment status: $STATUS"

        aws ssm get-command-invocation \
          --region "$AWS_DEFAULT_REGION" \
          --command-id "$COMMAND_ID" \
          --instance-id "$K3S_INSTANCE_ID" \
          --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
          --output json

        if [ "$STATUS" != "Success" ]; then
          echo "ERROR: Kubernetes deployment failed"
          exit 1
        fi

        echo "Kubernetes deployment succeeded."

  post_build:
    commands:
      - echo "=== DEPLOY POST-BUILD PHASE ==="
      - echo "PayLater deployment finished successfully."
      - echo "Deployed source version: $CODEBUILD_RESOLVED_SOURCE_VERSION"
