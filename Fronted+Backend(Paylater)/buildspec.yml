version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: "us-east-1"
    ECR_REGISTRY: "465630415715.dkr.ecr.us-east-1.amazonaws.com"

phases:

  install:
    commands:
      - echo "=== INSTALL PHASE ==="
      - echo "Checking required tools..."
      - aws --version
      - docker --version
      - echo "Install phase completed"

  pre_build:
    commands:
      - echo "=== PRE-BUILD PHASE ==="
      - echo "CodeBuild source directory:"
      - pwd
      - ls -la

      - echo "Entering PayLater project..."
      - cd "$CODEBUILD_SRC_DIR/Fronted+Backend(Paylater)"

      - echo "PayLater project directory:"
      - pwd

      - echo "Validating PayLater project..."

      - test -f go.work
      - test -f docker-compose.yml
      - test -f docker-compose.prod.yml
      - test -f buildspec.yml

      - test -d backend
      - test -d frontend
      - test -d k8s

      - test -f backend/services/user/Dockerfile
      - test -f backend/services/transaction/Dockerfile
      - test -f backend/services/merchant/Dockerfile
      - test -f backend/services/admin/Dockerfile
      - test -f backend/services/report/Dockerfile
      - test -f backend/services/gateway/Dockerfile
      - test -f frontend/Dockerfile

      - echo "Project validation successful"

      - echo "Creating image tag..."

      - |
        if [ -n "$CODEBUILD_RESOLVED_SOURCE_VERSION" ]; then
          IMAGE_TAG="$CODEBUILD_RESOLVED_SOURCE_VERSION"
        else
          IMAGE_TAG="build-$CODEBUILD_BUILD_NUMBER"
        fi

        echo "$IMAGE_TAG" > "$CODEBUILD_SRC_DIR/image-tag.txt"

        echo "======================================"
        echo "IMAGE TAG: $IMAGE_TAG"
        echo "======================================"

      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - echo "ECR login successful"

  build:
    commands:
      - echo "=== BUILD PHASE ==="
      - cd "$CODEBUILD_SRC_DIR/Fronted+Backend(Paylater)"

      - IMAGE_TAG=$(cat "$CODEBUILD_SRC_DIR/image-tag.txt")

      - echo "Using image tag:"
      - echo "$IMAGE_TAG"

      - echo "Building user service..."
      - docker build -f backend/services/user/Dockerfile -t "$ECR_REGISTRY/paylater-user:$IMAGE_TAG" .

      - echo "Building transaction service..."
      - docker build -f backend/services/transaction/Dockerfile -t "$ECR_REGISTRY/paylater-transaction:$IMAGE_TAG" .

      - echo "Building merchant service..."
      - docker build -f backend/services/merchant/Dockerfile -t "$ECR_REGISTRY/paylater-merchant:$IMAGE_TAG" .

      - echo "Building admin service..."
      - docker build -f backend/services/admin/Dockerfile -t "$ECR_REGISTRY/paylater-admin:$IMAGE_TAG" .

      - echo "Building report service..."
      - docker build -f backend/services/report/Dockerfile -t "$ECR_REGISTRY/paylater-report:$IMAGE_TAG" .

      - echo "Building gateway service..."
      - docker build -f backend/services/gateway/Dockerfile -t "$ECR_REGISTRY/paylater-gateway:$IMAGE_TAG" .

      - echo "Building frontend..."
      - docker build -f frontend/Dockerfile -t "$ECR_REGISTRY/paylater-frontend:$IMAGE_TAG" frontend

      - echo "All PayLater Docker images built successfully"

  post_build:
    commands:
      - echo "=== POST-BUILD PHASE ==="
      - cd "$CODEBUILD_SRC_DIR/Fronted+Backend(Paylater)"

      - IMAGE_TAG=$(cat "$CODEBUILD_SRC_DIR/image-tag.txt")

      - echo "Pushing images to Amazon ECR..."
      - echo "Image tag: $IMAGE_TAG"

      - docker push "$ECR_REGISTRY/paylater-user:$IMAGE_TAG"
      - docker push "$ECR_REGISTRY/paylater-transaction:$IMAGE_TAG"
      - docker push "$ECR_REGISTRY/paylater-merchant:$IMAGE_TAG"
      - docker push "$ECR_REGISTRY/paylater-admin:$IMAGE_TAG"
      - docker push "$ECR_REGISTRY/paylater-report:$IMAGE_TAG"
      - docker push "$ECR_REGISTRY/paylater-gateway:$IMAGE_TAG"
      - docker push "$ECR_REGISTRY/paylater-frontend:$IMAGE_TAG"

      - echo "All images pushed successfully"
      - echo "CI build and ECR push completed successfully"

artifacts:
  files:
    - "image-tag.txt"
    - "Fronted+Backend(Paylater)/k8s/**/*"
    - "Fronted+Backend(Paylater)/buildspec.yml"
    - "Fronted+Backend(Paylater)/deploy-buildspec.yml"
  discard-paths: no
